apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: nexus-service
  labels:
    app: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: nexus-notification-service:1.0-early
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3006
              name: http
          envFrom:
            - configMapRef:
                name: nexus-common-config
          env:
            - name: PORT
              value: '3006'
            - name: SERVICE_HTTP_PORT
              value: '3006'
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service-svc
  namespace: nexus-service
  labels:
    app: notification-service
spec:
  type: ClusterIP
  ports:
    - port: 3006
      targetPort: 3006
      name: http
  selector:
    app: notification-service
