apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: nexus-service
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: nexus-api-gateway:1.0-early
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: nexus-common-config
          env:
            - name: PORT
              value: '3000'
            - name: SERVICE_HTTP_PORT
              value: '3000'
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-svc
  namespace: nexus-service
  labels:
    app: api-gateway
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: api-gateway
