apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  namespace: nexus-infra
  labels:
    app: tempo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tempo
  template:
    metadata:
      labels:
        app: tempo
    spec:
      containers:
        - name: tempo
          image: grafana/tempo:2.3.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3200
              name: http
