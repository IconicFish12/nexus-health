syntax = "proto3";

package nexus.pharmacy.v1;

import "google/protobuf/timestamp.proto";
import "v1/main.proto";

option go_package = "nexus/pharmacy/v1;pharmacyv1";

enum PrescriptionStatus {
  PRESCRIPTION_STATUS_UNSPECIFIED         = 0;
  PRESCRIPTION_STATUS_PENDING             = 1;
  PRESCRIPTION_STATUS_PARTIALLY_DISPENSED = 2;
  PRESCRIPTION_STATUS_DISPENSED           = 3;
  PRESCRIPTION_STATUS_CANCELLED           = 4;
}

message Drug {
  string id = 1;
  string name = 2;
  string generic_name = 3;
  string drug_class = 4;
  repeated string dosage_forms = 5;
  double unit_price = 6;
  int32 quantity_on_hand = 7;
  int32 reorder_level = 8;
  bool is_controlled = 9;
  repeated string interaction_warnings = 10;
  string batch_code = 11;
  google.protobuf.Timestamp expiration_date = 12;
  google.protobuf.Timestamp updated_at = 13;
}

message PrescriptionItem {
  string id = 1;
  string prescription_id = 2;
  string drug_id = 3;
  string dosage_instructions = 4;
  int32 qty_prescribed = 5;
  int32 qty_dispensed = 6;
  optional google.protobuf.Timestamp dispensed_at = 7;
  optional string dispensed_by = 8;
  optional Drug drug = 9;
}

message Prescription {
  string id = 1;
  string patient_id = 2;
  string doctor_id = 3;
  string emr_id = 4;
  PrescriptionStatus status = 5;
  repeated PrescriptionItem items = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

service PharmacyService {
  rpc CreateDrug (CreateDrugRequest) returns (CreateDrugResponse);
  rpc GetDrug (GetDrugRequest) returns (GetDrugResponse);
  rpc ListDrugs (ListDrugsRequest) returns (ListDrugsResponse);
  
  rpc CreatePrescription (CreatePrescriptionRequest) returns (CreatePrescriptionResponse);
  rpc GetPrescription (GetPrescriptionRequest) returns (GetPrescriptionResponse);
  rpc DispensePrescriptionItem (DispensePrescriptionItemRequest) returns (DispensePrescriptionItemResponse);
}

message CreateDrugRequest {
  string name = 1;
  string generic_name = 2;
  string drug_class = 3;
  repeated string dosage_forms = 4;
  double unit_price = 5;
  int32 quantity_on_hand = 6;
  int32 reorder_level = 7;
  bool is_controlled = 8;
  repeated string interaction_warnings = 9;
  string batch_code = 10;
  google.protobuf.Timestamp expiration_date = 11;
}

message CreateDrugResponse {
  Drug drug = 1;
  nexus.main.v1.Error error = 2;
}

message GetDrugRequest {
  string id = 1;
}

message GetDrugResponse {
  Drug drug = 1;
  nexus.main.v1.Error error = 2;
}

message ListDrugsRequest {
  int32 page = 1;
  int32 limit = 2;
  optional string search = 3;
}

message ListDrugsResponse {
  repeated Drug drugs = 1;
  nexus.main.v1.PaginationMeta pagination = 2;
  nexus.main.v1.Error error = 3;
}

message CreatePrescriptionItemInput {
  string drug_id = 1;
  string dosage_instructions = 2;
  int32 qty_prescribed = 3;
}

message CreatePrescriptionRequest {
  string patient_id = 1;
  string doctor_id = 2;
  string emr_id = 3;
  repeated CreatePrescriptionItemInput items = 4;
}

message CreatePrescriptionResponse {
  Prescription prescription = 1;
  nexus.main.v1.Error error = 2;
}

message GetPrescriptionRequest {
  string id = 1;
}

message GetPrescriptionResponse {
  Prescription prescription = 1;
  nexus.main.v1.Error error = 2;
}

message DispensePrescriptionItemRequest {
  string prescription_item_id = 1;
  int32 qty_to_dispense = 2;
  string pharmacist_id = 3;
}

message DispensePrescriptionItemResponse {
  PrescriptionItem item = 1;
  nexus.main.v1.Error error = 2;
}
