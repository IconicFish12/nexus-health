syntax = "proto3";

package nexus.notification.v1;

import "google/protobuf/timestamp.proto";
import "v1/main.proto";

option go_package = "nexus/notification/v1;notificationv1";

enum NotificationChannel {
  NOTIFICATION_CHANNEL_UNSPECIFIED = 0;
  NOTIFICATION_CHANNEL_EMAIL       = 1;
  NOTIFICATION_CHANNEL_SMS         = 2;
  NOTIFICATION_CHANNEL_PUSH        = 3;
  NOTIFICATION_CHANNEL_NATS        = 4;
}

enum DeliveryStatus {
  DELIVERY_STATUS_UNSPECIFIED = 0;
  DELIVERY_STATUS_QUEUED      = 1;
  DELIVERY_STATUS_DELIVERED   = 2;
  DELIVERY_STATUS_FAILED      = 3;
}

message Notification {
  string id = 1;
  string recipient_id = 2;
  NotificationChannel channel = 3;
  string title = 4;
  string body = 5;
  DeliveryStatus status = 6;
  google.protobuf.Timestamp sent_at = 7;
}

service NotificationService {
  rpc SendNotification (SendNotificationRequest) returns (SendNotificationResponse);
  rpc GetNotificationStatus (GetNotificationStatusRequest) returns (GetNotificationStatusResponse);
}

message SendNotificationRequest {
  string recipient_id = 1;
  NotificationChannel channel = 2;
  string title = 3;
  string body = 4;
  optional string recipient_address = 5; // Email address or phone number
}

message SendNotificationResponse {
  Notification notification = 1;
  nexus.main.v1.Error error = 2;
}

message GetNotificationStatusRequest {
  string id = 1;
}

message GetNotificationStatusResponse {
  Notification notification = 1;
  nexus.main.v1.Error error = 2;
}
