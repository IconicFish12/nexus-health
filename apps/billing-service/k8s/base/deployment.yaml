apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  namespace: nh-billing-service
  labels:
    app: billing-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: billing-service
  template:
    metadata:
      labels:
        app: billing-service
    spec:
      initContainers:
        - name: db-migration
          image: nexus/billing-service:1.0-early
          command: ['bunx', 'prisma', 'migrate', 'deploy']
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: billing-service-secret
                  key: DATABASE_URL
      containers:
        - name: billing-service
          image: nexus-billing-service:1.0-early
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5003
              name: http
          envFrom:
            - configMapRef:
                name: nexus-common-config
          env:
            - name: PORT
              value: '5003'
            - name: SERVICE_HTTP_PORT
              value: '5003'
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: billing-service-secret
                  key: DATABASE_URL
