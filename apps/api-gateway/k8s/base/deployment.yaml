apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: nh-api-gateway
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: nexus-api-gateway:1.0-early
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: nexus-common-config
          env:
            - name: PORT
              value: '5000'
            - name: SERVICE_HTTP_PORT
              value: '5000'
