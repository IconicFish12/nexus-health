apiVersion: apps/v1
kind: Deployment
metadata:
  name: staff-service
  namespace: nh-staff-service
  labels:
    app: staff-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: staff-service
  template:
    metadata:
      labels:
        app: staff-service
    spec:
      initContainers:
        - name: db-migration
          image: nexus/staff-service:1.0-early
          command: ['bunx', 'prisma', 'migrate', 'deploy']
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: staff-service-secret
                  key: DATABASE_URL
      containers:
        - name: staff-service
          image: nexus-staff-service:1.0-early
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5008
              name: http
          envFrom:
            - configMapRef:
                name: nexus-common-config
          env:
            - name: PORT
              value: '5008'
            - name: SERVICE_HTTP_PORT
              value: '5008'
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: staff-service-secret
                  key: DATABASE_URL
