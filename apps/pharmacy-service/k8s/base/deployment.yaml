apiVersion: apps/v1
kind: Deployment
metadata:
  name: pharmacy-service
  namespace: nh-pharmacy-service
  labels:
    app: pharmacy-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pharmacy-service
  template:
    metadata:
      labels:
        app: pharmacy-service
    spec:
      initContainers:
        - name: db-migration
          image: nexus/pharmacy-service:1.0-early
          command: ['bunx', 'prisma', 'migrate', 'deploy']
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pharmacy-service-secret
                  key: DATABASE_URL
      containers:
        - name: pharmacy-service
          image: nexus-pharmacy-service:1.0-early
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5007
              name: http
          envFrom:
            - configMapRef:
                name: nexus-common-config
          env:
            - name: PORT
              value: '5007'
            - name: SERVICE_HTTP_PORT
              value: '5007'
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pharmacy-service-secret
                  key: DATABASE_URL
