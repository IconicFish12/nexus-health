apiVersion: apps/v1
kind: Deployment
metadata:
  name: emr-service
  namespace: nh-emr-service
  labels:
    app: emr-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: emr-service
  template:
    metadata:
      labels:
        app: emr-service
    spec:
      initContainers:
        - name: db-migration
          image: nexus/emr-service:1.0-early
          command: ['bunx', 'prisma', 'migrate', 'deploy']
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: emr-service-secret
                  key: DATABASE_URL
      containers:
        - name: emr-service
          image: nexus/emr-service:1.0-early
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5004
              name: http
          envFrom:
            - configMapRef:
                name: nexus-common-config
          env:
            - name: PORT
              value: '5004'
            - name: SERVICE_HTTP_PORT
              value: '5004'
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: emr-service-secret
                  key: DATABASE_URL
