apiVersion: apps/v1
kind: Deployment
metadata:
  name: appointment-service
  namespace: nh-appointment-service
  labels:
    app: appointment-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: appointment-service
  template:
    metadata:
      labels:
        app: appointment-service
    spec:
      initContainers:
        - name: db-migration
          image: nexus/appointment-service:1.0-early
          command: ['bunx', 'prisma', 'migrate', 'deploy']
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: appointment-service-secret
                  key: DATABASE_URL
      containers:
        - name: appointment-service
          image: nexus-appointment-service:1.0-early
          imagePullPolicy: IfNotPresent
          livenessProbe:
            initialDelaySeconds: 10
            timeoutSeconds: 5
            periodSeconds: 20
          ports:
            - containerPort: 5001
              name: http
          envFrom:
            - configMapRef:
                name: nexus-common-config
          env:
            - name: PORT
              value: '5001'
            - name: SERVICE_HTTP_PORT
              value: '5001'
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: appointment-service-secret
                  key: DATABASE_URL
