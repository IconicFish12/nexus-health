apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: nexus-service
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/part-of: nexus-healthcare-system
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: nexus-notification-service:1.0-early
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5006
              name: http
            - containerPort: 500056
              name: grpc
          envFrom:
            - configMapRef:
                name: nexus-common-config
            - configMapRef:
                name: notification-service-config
            - secretRef:
                name: notification-service-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 5006
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5006
            initialDelaySeconds: 15
            periodSeconds: 15
