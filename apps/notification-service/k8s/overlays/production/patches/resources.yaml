apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: nexus-service
spec:
  template:
    spec:
      containers:
        - name: notification-service
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
