server_name: nh-nats-server

host: 0.0.0.0
port: 4222
http_port: 8222

max_connection: 10000
max_payload: 10M
max_pending: 64MB

ping_interval: "20s"
ping_max: 3

jetstream {
  store_dir: /data
  max_memory_store: 5G
  max_file_store: 10G
}

authorizations {
  users = [
    api-gateway {
      
    }
    appointment-service {
      
    }
    auth-service {
      
    }
    billing-service {
      
    }
    emr-service {

    }
    inventory-service {

    }
    notification-service {

    }
    pharmacy-service {

    }
    staff-service { 
    
    }
    ward-service {

    }
  ]
}

debug: false
trace: false
logtime: true
